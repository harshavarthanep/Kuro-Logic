<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kuro Logic - Glass OS</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --text-main: #ffffff;
            --text-muted: rgba(235, 235, 245, 0.6);
            --system-blue: #0A84FF;
            --system-red: #FF453A;
            --system-green: #30D158;
            --system-orange: #FF9F0A;
            
            --theme-color: var(--system-blue);
            --bg-gradient: radial-gradient(circle at 15% 50%, #1a1a2e, #0f0c29);
            --blob-speed: 12s; 
            --blob-opacity: 0.5;
            
            /* Parallax variables */
            --tilt-x: 0px;
            --tilt-y: 0px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg-gradient); color: var(--text-main);
            min-height: 100dvh; height: 100dvh; overflow: hidden; display: flex; align-items: center; justify-content: center;
            transition: background 1s ease;
        }

        /* Fluid Background Blobs with Parallax */
        .parallax-layer { 
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; 
            transform: translate(var(--tilt-x), var(--tilt-y)); 
            transition: transform 0.1s ease-out;
            will-change: transform; 
        }
        .bg-blob { 
            position: absolute; border-radius: 50%; filter: blur(60px); opacity: var(--blob-opacity); 
            animation: float var(--blob-speed) infinite alternate ease-in-out; 
            transition: opacity 0.5s ease, filter 0.5s ease;
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0); 
        }
        .blob-1 { top: 5%; left: 0%; width: 75vmin; height: 75vmin; background: var(--theme-color); }
        .blob-2 { bottom: 5%; right: 0%; width: 85vmin; height: 85vmin; background: #4a00e0; animation-delay: -5s; }

        @keyframes float { 
            0% { transform: translate3d(0, 0, 0) scale(1); } 
            100% { transform: translate3d(15vmin, 15vmin, 0) scale(1.15); } 
        }

        /* App Layout with Boot Animation */
        #app { 
            width: 100%; max-width: 1000px; height: 100dvh; max-height: 100dvh; padding: 15px; 
            display: grid; gap: 12px; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: 1fr; 
            opacity: 0; 
            transform: scale(0.95);
            transition: opacity 1s cubic-bezier(0.34, 1.56, 0.64, 1), transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        #app.booted {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }
        
        @media (min-width: 768px) {
            #app { grid-template-rows: auto 1fr; grid-template-columns: 1fr 340px; align-content: center; gap: 20px; padding: 25px;}
            header { grid-column: 1 / -1; }
            #sidebar { display: flex; flex-direction: column; gap: 20px; justify-content: center; }
            #board-container { height: 100%; }
        }

        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 22px; box-shadow: var(--glass-shadow); padding: 16px; }

        header { display: flex; justify-content: space-between; align-items: center; position: relative; padding: 14px 20px; overflow: hidden;}
        .branding h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .tier-name { font-size: 12px; color: var(--theme-color); font-weight: 600; }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .score-box { text-align: right; }
        .score-val { font-size: 22px; font-weight: 800; }
        .score-label { font-size: 10px; color: var(--theme-color); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        
        .util-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .util-btn:active { transform: scale(0.85); }

        .timer-container { position: relative; flex-grow: 1; max-width: 200px; margin: 0 15px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
        #timer-bar { height: 100%; background: var(--theme-color); width: 100%; transition: width 1s linear, background 0.3s; border-radius: 10px; }

        #board-container { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 10px; perspective: 1000px; }
        
        /* Premium Entrance & Resume Animations */
        @keyframes boardPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .board-animate { animation: boardPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        @keyframes springBoard {
            0% { transform: scale(0.85); opacity: 0.5; }
            40% { transform: scale(1.02); opacity: 1; }
            70% { transform: scale(0.98); }
            100% { transform: scale(1); opacity: 1; }
        }
        .spring-board { animation: springBoard 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        @keyframes cellPop {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .cell-entrance { animation: cellPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

        @keyframes springCell {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .spring-cell { animation: springCell 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

        #game-board {
            display: grid; gap: 1.5%; padding: 3%; border-radius: 24px;
            background: rgba(0, 0, 0, 0.25); border: 1px solid var(--glass-border); box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
            width: 100%; max-width: min(100vw - 60px, 55vh); aspect-ratio: 1 / 1; 
            transition: border-color 0.4s ease, box-shadow 0.4s ease; transform-style: preserve-3d;
        }
        
        .cell {
            width: 100%; height: 100%; background: rgba(255,255,255,0.04); border-radius: 15%; 
            border: 1px solid rgba(255,255,255,0.03); cursor: pointer; display: flex; justify-content: center; align-items: center; position: relative;
            /* Added background and border-color to base transition for pure fades */
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, border-color 0.3s ease, box-shadow 0.2s, opacity 0.3s;
        }
        .cell:active { transform: scale(0.85); }
        .cell.active { background: var(--theme-color); box-shadow: 0 0 18px var(--theme-color); transform: scale(0.95); border-color: transparent; }
        .cell.locked { background: var(--system-green); box-shadow: 0 0 14px var(--system-green); pointer-events: none; opacity: 0.85; }
        
        /* Smooth Error States - Pure soft fade */
        .cell::after {
            content: '✕'; position: absolute; color: var(--system-red); font-size: min(5vw, 24px); font-weight: bold;
            opacity: 0; transform: scale(0.8); transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none;
        }
        .cell.error {
            border-color: var(--system-red); background: rgba(255, 69, 58, 0.15); 
        }
        .cell.error::after { opacity: 1; transform: scale(1); }

        /* Cascade Win Animation */
        .cell.win-bloom { animation: bloom 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes bloom { 0% { transform: scale(0.95); box-shadow: 0 0 18px var(--theme-color); } 50% { transform: scale(1.1); background: #fff; box-shadow: 0 0 30px #fff; z-index: 10;} 100% { transform: scale(0); opacity: 0; } }

        .control-group { margin-bottom: 14px; }
        .control-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding-left: 2px; font-weight: 600;}
        
        .tool-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .tool { height: 54px; border-radius: 14px; background: rgba(255,255,255,0.04); display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-muted); border: 1px solid transparent; cursor: pointer; transition: 0.2s; }
        .tool span { font-size: 20px; font-weight: 300; margin-bottom: 1px; }
        .tool label { font-size: 9px; font-weight: 600; }
        .tool.selected { background: rgba(255,255,255,0.12); color: var(--theme-color); border-color: var(--theme-color); transform: scale(1.05);}

        .action-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .btn { padding: 12px 8px; border-radius: 14px; background: rgba(255,255,255,0.04); color: var(--text-main); border: 1px solid var(--glass-border); font-size: 12px; font-weight: 600; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .btn:active { transform: scale(0.92); }
        .btn-cost { font-size: 9px; color: var(--theme-color); font-weight: 800; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 6px; }
        .btn-check { background: rgba(255,255,255,0.08); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 100; padding: 20px; }
        .modal.show { opacity: 1; pointer-events: all; }
        .modal-content { background: rgba(20, 20, 30, 0.85); border: 1px solid var(--glass-border); padding: 28px; border-radius: 32px; text-align: center; max-width: 380px; width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,0.6); transform: translateY(20px); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .modal.show .modal-content { transform: translateY(0); }
        .modal h2 { font-size: 26px; margin-bottom: 10px; font-weight: 800; letter-spacing: -0.5px;}
        .modal p { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; line-height: 1.5; font-weight: 500;}
        
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-primary, .btn-secondary { width: 100%; padding: 16px; border-radius: 18px; font-size: 16px; font-weight: 700; border: none; cursor: pointer; transition: transform 0.2s; }
        .btn-primary { background: var(--text-main); color: #000; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid var(--glass-border); display: none; align-items: center; justify-content: center; gap: 8px;}
        .btn-primary:active, .btn-secondary:active { transform: scale(0.96); }

        .watermark { position: absolute; bottom: 8px; width: 100%; text-align: center; font-size: 10px; font-weight: 600; color: rgba(255, 255, 255, 0.25); pointer-events: none; z-index: 50; letter-spacing: 0.5px; }
        
        /* Hidden canvas for generating share image */
        #share-canvas { display: none; }
    </style>
</head>
<body>

    <div class="parallax-layer">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
    </div>

    <div id="app">
        <header class="glass-panel">
            <div class="branding">
                <h1>KURO</h1>
                <div id="tier-display" class="tier-name">OS Level 1</div>
            </div>

            <div class="timer-container"><div id="timer-bar"></div></div>
            
            <div class="header-right">
                <div class="score-box">
                    <div id="score-display" class="score-val">0</div>
                    <div class="score-label">Logic IQ</div>
                </div>
                <button class="util-btn" id="btn-install" style="display: none;" title="Install App">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
                <button class="util-btn" id="btn-audio" title="Mute/Unmute">
                    <svg id="icon-vol-on" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    <svg id="icon-vol-off" style="display:none;" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="1" x2="1" y2="23"></line></svg>
                </button>
            </div>
        </header>

        <div id="board-container">
            <div id="game-board"></div>
        </div>

        <div id="sidebar" class="glass-panel">
            <div class="control-group">
                <div class="control-title">Logic Tools</div>
                <div class="tool-row" id="tools">
                    <div class="tool selected" data-type="dot"><span>■</span><label>Point</label></div>
                    <div class="tool" data-type="plus"><span>+</span><label>Cross</label></div>
                    <div class="tool" data-type="cross"><span>×</span><label>Diag</label></div>
                </div>
            </div>

            <div class="control-group" style="margin-bottom: 0;">
                <div class="control-title">Super Powers (Store)</div>
                <div class="action-row">
                    <button class="btn btn-check" id="btn-check">
                        <div>✓ Verify Moves</div>
                        <div class="btn-cost" style="color:var(--text-main)">FREE</div>
                    </button>
                    <button class="btn" id="btn-hint">
                        <div>💡 Auto-Solve 1</div>
                        <div class="btn-cost" id="cost-hint">50 IQ</div>
                    </button>
                    <button class="btn" id="btn-peek">
                        <div>👁 Flash Pattern</div>
                        <div class="btn-cost" id="cost-peek">30 IQ</div>
                    </button>
                    <button class="btn" id="btn-skip">
                        <div>⏭ Skip Level</div>
                        <div class="btn-cost" id="cost-skip">200 IQ</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="msg-modal" class="modal">
        <div class="modal-content">
            <h2 id="msg-title">Title</h2>
            <p id="msg-desc">Description</p>
            <div class="modal-actions">
                <button class="btn-primary" id="btn-modal-action">Continue</button>
                <button class="btn-secondary" id="btn-modal-share">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    Share IQ
                </button>
            </div>
        </div>
    </div>
    
    <canvas id="share-canvas" width="1080" height="1080"></canvas>
    <div class="watermark">Made with ❤️ by Harsha Varthan E P</div>

    <script>
        // --- State Management ---
        let state = {
            level: parseInt(localStorage.getItem('kuro_level')) || 1,
            score: parseInt(localStorage.getItem('kuro_score')) || 0,
            gridSize: 3,
            target: [],
            current: [],
            locked: [],
            activeTool: 'dot',
            isMemorizing: false,
            timeTotal: 60,
            timeLeft: 60,
            timerId: null,
            flashTimeoutId: null,
            costs: { peek: 0, hint: 0, skip: 0 },
            audioMuted: localStorage.getItem('kuro_muted') === 'true', 
            themeIndex: 0
        };

        const themes = [
            { name: "Glass", color: "#0A84FF", bg: "radial-gradient(circle at 15% 50%, #001233, #000000)", freqs: [220, 277.18, 329.63, 440] },
            { name: "Neon", color: "#30D158", bg: "radial-gradient(circle at 85% 20%, #00220e, #000000)", freqs: [196, 246.94, 293.66, 392] },
            { name: "Magma", color: "#FF453A", bg: "radial-gradient(circle at 50% 80%, #220000, #000000)", freqs: [164.81, 196, 220, 329.63] },
            { name: "Pro", color: "#BF5AF2", bg: "radial-gradient(circle at 50% 50%, #140024, #000000)", freqs: [130.81, 155.56, 196, 261.63] }
        ];

        const DOM = {
            app: document.getElementById('app'),
            board: document.getElementById('game-board'),
            tierDisplay: document.getElementById('tier-display'),
            scoreDisplay: document.getElementById('score-display'),
            timerBar: document.getElementById('timer-bar'),
            tools: document.querySelectorAll('.tool'),
            modal: document.getElementById('msg-modal'),
            modalTitle: document.getElementById('msg-title'),
            modalDesc: document.getElementById('msg-desc'),
            modalBtn: document.getElementById('btn-modal-action'),
            modalShareBtn: document.getElementById('btn-modal-share'),
            audioBtn: document.getElementById('btn-audio'),
            installBtn: document.getElementById('btn-install')
        };

        // --- Haptics Engine ---
        function triggerHaptic(type) {
            if (!('vibrate' in navigator)) return;
            try {
                if (type === 'light') navigator.vibrate(10); 
                else if (type === 'medium') navigator.vibrate(15); 
                else if (type === 'heavy') navigator.vibrate([40, 40, 40]); 
                else if (type === 'success') navigator.vibrate([20, 30, 20, 30, 50]); 
            } catch(e) {}
        }

        // --- Premium Web Audio Engine ---
        let audioCtx = null;
        let bgmOsc = null, bgmGain = null, bgmFilter = null, bgmTimeout = null, bgmStep = 0;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startBmitter();
        }

        function startBmitter() {
            if (!audioCtx || state.audioMuted) return;
            try {
                bgmOsc = audioCtx.createOscillator();
                bgmGain = audioCtx.createGain();
                bgmFilter = audioCtx.createBiquadFilter();
                bgmOsc.type = 'sine'; 
                bgmFilter.type = 'lowpass';
                bgmFilter.frequency.value = 600; 
                bgmGain.gain.setValueAtTime(0, audioCtx.currentTime); 
                bgmOsc.connect(bgmFilter); bgmFilter.connect(bgmGain); bgmGain.connect(audioCtx.destination);
                bgmOsc.start();
                tickBGM();
            } catch(e) {}
        }

        function tickBGM() {
            if (!audioCtx || state.audioMuted || !bgmOsc) return;
            let now = audioCtx.currentTime;
            let pct = state.timeLeft / state.timeTotal;
            let currentChord = themes[state.themeIndex].freqs;
            let freq = currentChord[bgmStep % currentChord.length];
            bgmStep++; 
            
            let interval = 1200;
            if (pct <= 0.25) { interval = 350; bgmFilter.frequency.value = 1200; } 
            else if (pct <= 0.5) { interval = 600; bgmFilter.frequency.value = 800; } 
            else { bgmFilter.frequency.value = 400; } 
            
            bgmOsc.frequency.setTargetAtTime(freq, now, 0.1);
            bgmGain.gain.cancelScheduledValues(now);
            bgmGain.gain.setValueAtTime(0.01, now);
            bgmGain.gain.linearRampToValueAtTime(0.8, now + 0.1);
            bgmGain.gain.exponentialRampToValueAtTime(0.01, now + (interval/1000) * 0.8);
            bgmTimeout = setTimeout(tickBGM, interval);
        }

        function playSound(type) {
            if (type === 'tap') triggerHaptic('medium');
            else if (type === 'error') triggerHaptic('heavy');
            else if (type === 'win') triggerHaptic('success');

            if (!audioCtx || state.audioMuted) return;
            let now = audioCtx.currentTime;
            const createSynth = (waveType, startFreq) => {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = waveType; osc.frequency.setValueAtTime(startFreq, now);
                osc.connect(gain); gain.connect(audioCtx.destination); return { osc, gain };
            };

            if (type === 'tap') {
                let synth = createSynth('sine', 1200);
                synth.gain.gain.setValueAtTime(0.8, now);
                synth.gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                synth.osc.start(now); synth.osc.stop(now + 0.05);
            } else if (type === 'error') {
                let synth = createSynth('triangle', 200);
                synth.gain.gain.setValueAtTime(2.5, now);
                synth.gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                synth.osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                synth.osc.start(now); synth.osc.stop(now + 0.2);
            } else if (type === 'win') {
                const chimeNotes = [523.25, 659.25, 783.99, 1046.50];
                chimeNotes.forEach((freq, i) => {
                    let synth = createSynth('sine', freq);
                    let startTime = now + (i * 0.06);
                    synth.gain.gain.setValueAtTime(0, now);
                    synth.gain.gain.setValueAtTime(0.5, startTime);
                    synth.gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.5);
                    synth.osc.start(startTime); synth.osc.stop(startTime + 0.5);
                });
            }
        }
        
        document.querySelectorAll('.btn, .util-btn, .btn-primary, .btn-secondary').forEach(el => {
            el.addEventListener('pointerdown', () => { initAudio(); triggerHaptic('light'); playSound('tap'); });
        });
        
        function updateAudioTrack() { if (bgmOsc && audioCtx && !state.audioMuted) bgmStep = 0; }

        DOM.audioBtn.addEventListener('click', () => {
            initAudio(); 
            triggerHaptic('light');
            state.audioMuted = !state.audioMuted;
            localStorage.setItem('kuro_muted', state.audioMuted);
            document.getElementById('icon-vol-on').style.display = state.audioMuted ? 'none' : 'block';
            document.getElementById('icon-vol-off').style.display = state.audioMuted ? 'block' : 'none';
            if (state.audioMuted) { clearTimeout(bgmTimeout); if (bgmOsc) { try { bgmOsc.stop(); } catch(e){} bgmOsc = null; } } 
            else { startBmitter(); }
        });

        // --- Optimized Parallax ---
        let parallaxTicking = false;
        window.addEventListener('deviceorientation', (e) => {
            if (!e.gamma || !e.beta) return;
            if (!parallaxTicking) {
                window.requestAnimationFrame(() => {
                    const x = Math.min(Math.max(e.gamma, -40), 40) / 40; 
                    const y = Math.min(Math.max(e.beta, -40), 40) / 40;
                    document.documentElement.style.setProperty('--tilt-x', `${x * 15}px`);
                    document.documentElement.style.setProperty('--tilt-y', `${y * 15}px`);
                    parallaxTicking = false;
                });
                parallaxTicking = true;
            }
        });

        // --- Performance & Visibility Management (Pause/Resume + Spring) ---
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
                
                // Pause everything
                clearInterval(state.timerId);
                clearTimeout(state.flashTimeoutId);
                
            } else {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                
                // Only trigger resume animations if actively in a level (game booted & no modal showing)
                if (DOM.app.classList.contains('booted') && !DOM.modal.classList.contains('show') && state.target.length > 0) {
                    
                    DOM.board.classList.remove('board-animate', 'spring-board');
                    void DOM.board.offsetWidth; 
                    DOM.board.classList.add('spring-board');
                    
                    document.querySelectorAll('.cell').forEach((cell, i) => {
                        cell.classList.remove('cell-entrance', 'spring-cell');
                        void cell.offsetWidth;
                        const row = Math.floor(i / state.gridSize);
                        const col = i % state.gridSize;
                        // Increased stagger delay to 60ms for a more visible, deliberate wave
                        cell.style.animationDelay = `${(row + col) * 60}ms`;
                        cell.classList.add('spring-cell');
                    });

                    // Increased wait time before flashing the pattern so the grid finishes its entrance
                    setTimeout(() => { flashPattern(); }, 1200);
                }
            }
        });

        // --- Native PWA Install Handler ---
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            DOM.installBtn.style.display = 'flex'; 
        });
        
        DOM.installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return; 
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                deferredPrompt = null;
                DOM.installBtn.style.display = 'none';
            }
        });
        
        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            DOM.installBtn.style.display = 'none';
        });

        // --- Core Application Initialization ---
        function initGame() {
            updateScoreUI();
            document.getElementById('icon-vol-on').style.display = state.audioMuted ? 'none' : 'block';
            document.getElementById('icon-vol-off').style.display = state.audioMuted ? 'block' : 'none';
            
            showModal(
                "KURO LOGIC", 
                "System standby. Are you ready to initialize the logic grid?", 
                "Boot System ➔", 
                () => {
                    DOM.app.classList.add('booted'); 
                    initAudio(); 
                    setTimeout(() => { startLevel(); }, 400); 
                },
                false
            );
        }

        function calculateEconomy() {
            state.costs.peek = Math.floor(20 + (state.level * 10));
            state.costs.hint = Math.floor(40 + (state.level * 15));
            state.costs.skip = Math.floor(150 + (state.level * 50));
            document.getElementById('cost-peek').innerText = state.costs.peek + ' IQ';
            document.getElementById('cost-hint').innerText = state.costs.hint + ' IQ';
            document.getElementById('cost-skip').innerText = state.costs.skip + ' IQ';
        }

        function startLevel() {
            calculateEconomy();
            state.gridSize = Math.min(3 + Math.floor((state.level - 1) / 4), 7);
            state.themeIndex = Math.min(Math.floor((state.level - 1) / 4), themes.length - 1);
            
            document.documentElement.style.setProperty('--theme-color', themes[state.themeIndex].color);
            document.documentElement.style.setProperty('--bg-gradient', themes[state.themeIndex].bg);
            document.documentElement.style.setProperty('--blob-speed', '12s'); 
            document.documentElement.style.setProperty('--blob-opacity', '0.5');
            
            DOM.tierDisplay.innerText = `${themes[state.themeIndex].name} OS • Lv ${state.level}`;
            DOM.board.style.gridTemplateColumns = `repeat(${state.gridSize}, 1fr)`;
            DOM.board.style.gridTemplateRows = `repeat(${state.gridSize}, 1fr)`;
            
            state.timeTotal = Math.max(20, 45 + (state.gridSize * 10) - (state.level * 2));
            state.timeLeft = state.timeTotal;
            DOM.timerBar.style.background = 'var(--theme-color)';
            DOM.timerBar.style.width = '100%';
            
            updateAudioTrack();
            if (audioCtx && !state.audioMuted && !bgmOsc) startBmitter();
            
            // Trigger board pop animation
            DOM.board.classList.remove('board-animate', 'spring-board');
            void DOM.board.offsetWidth; 
            DOM.board.classList.add('board-animate');
            
            generateTarget();
            renderBoard();

            // WAIT for grid to animate in before showing pattern
            setTimeout(() => {
                flashPattern();
            }, 800);
        }

        function generateTarget() {
            const totalCells = state.gridSize * state.gridSize;
            state.target = Array(totalCells).fill(false);
            state.current = Array(totalCells).fill(false);
            state.locked = Array(totalCells).fill(false);
            const flips = state.level * 2; 
            for(let i=0; i<flips; i++) {
                let rIndex = Math.floor(Math.random() * totalCells);
                state.target[rIndex] = !state.target[rIndex];
            }
            if(!state.target.includes(true)) state.target[0] = true; 
        }

        function renderBoard() {
            DOM.board.innerHTML = '';
            for(let i = 0; i < state.gridSize * state.gridSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell cell-entrance';
                
                const row = Math.floor(i / state.gridSize);
                const col = i % state.gridSize;
                cell.style.animationDelay = `${(row + col) * 40}ms`;
                
                cell.dataset.index = i;
                cell.addEventListener('pointerdown', (e) => { e.preventDefault(); handleCellTap(i, cell); });
                DOM.board.appendChild(cell);
            }
            updateBoardVisuals();
        }

        function flashPattern() {
            state.isMemorizing = true;
            clearInterval(state.timerId);
            clearTimeout(state.flashTimeoutId); // Clear if previously running

            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                if(state.target[i]) cell.classList.add('active');
                else cell.classList.remove('active');
            });

            state.flashTimeoutId = setTimeout(() => {
                state.isMemorizing = false;
                updateBoardVisuals();
                startTimer();
            }, Math.max(2000, 4000 - (state.level * 100))); 
        }

        function startTimer() {
            clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timeLeft--;
                const pct = (state.timeLeft / state.timeTotal) * 100;
                DOM.timerBar.style.width = `${pct}%`;
                if(pct <= 25) {
                    DOM.timerBar.style.background = 'var(--system-red)';
                    document.documentElement.style.setProperty('--blob-speed', '3s'); 
                    document.documentElement.style.setProperty('--blob-opacity', '0.8');
                }
                if(state.timeLeft <= 0) {
                    clearInterval(state.timerId);
                    clearTimeout(bgmTimeout);
                    if (bgmOsc) { try { bgmOsc.stop(); } catch(e){} bgmOsc = null; }
                    playSound('error');
                    showModal("System Collapse", "Your focus faded before the solution was found.", "Retry Reboot", startLevel, false);
                }
            }, 1000);
        }

        function handleCellTap(index, cellEl) {
            if(state.isMemorizing) return;
            initAudio(); playSound('tap'); 
            
            // Remove error visually, handled elegantly by pure transitions now
            document.querySelectorAll('.cell.error').forEach(c => c.classList.remove('error'));
            
            const row = Math.floor(index / state.gridSize);
            const col = index % state.gridSize;
            
            const toggle = (r, c) => {
                if(r >= 0 && r < state.gridSize && c >= 0 && c < state.gridSize) {
                    let idx = r * state.gridSize + c;
                    if(!state.locked[idx]) state.current[idx] = !state.current[idx];
                }
            }
            if (state.activeTool === 'dot') { toggle(row, col); }
            if (state.activeTool === 'plus') { toggle(row, col); toggle(row-1, col); toggle(row+1, col); toggle(row, col-1); toggle(row, col+1); }
            if (state.activeTool === 'cross') { toggle(row, col); toggle(row-1, col-1); toggle(row-1, col+1); toggle(row+1, col-1); toggle(row+1, col+1); }
            
            updateBoardVisuals();
            checkWin();
        }

        function updateBoardVisuals() {
            if(state.isMemorizing) return;
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                // Preserve active animations & error states so they don't pop
                let isEntrance = cell.classList.contains('cell-entrance');
                let isSpring = cell.classList.contains('spring-cell');
                let isError = cell.classList.contains('error');
                
                cell.className = 'cell';
                if(isEntrance) cell.classList.add('cell-entrance');
                if(isSpring) cell.classList.add('spring-cell');
                if(isError) cell.classList.add('error');
                
                if(state.current[i]) cell.classList.add('active');
                if(state.locked[i]) cell.classList.add('locked');
            });
        }
        
        // --- Power Shop ---
        document.getElementById('btn-check').addEventListener('click', () => {
            if(state.isMemorizing) return;
            const cells = document.querySelectorAll('.cell');
            let foundError = false;
            for(let i=0; i<state.current.length; i++) {
                if(state.current[i] === true && state.target[i] === false) { cells[i].classList.add('error'); foundError = true; }
            }
            if(foundError) { playSound('error'); } 
            else {
                playSound('win');
                DOM.board.style.borderColor = 'var(--system-green)';
                DOM.board.style.boxShadow = 'inset 0 0 30px rgba(48, 209, 88, 0.4)';
                setTimeout(() => { DOM.board.style.borderColor = 'var(--glass-border)'; DOM.board.style.boxShadow = 'inset 0 0 20px rgba(0,0,0,0.4)'; }, 600);
            }
        });

        document.getElementById('btn-peek').addEventListener('click', () => {
            if(state.isMemorizing || !deductIQ(state.costs.peek)) return;
            const tempCurrent = [...state.current];
            
            DOM.board.classList.remove('board-animate', 'spring-board');
            void DOM.board.offsetWidth;
            DOM.board.classList.add('spring-board');
            
            setTimeout(() => {
                flashPattern();
                // Override the standard flash end for peek
                setTimeout(() => { state.current = tempCurrent; updateBoardVisuals(); }, 2000);
            }, 800);
        });

        document.getElementById('btn-hint').addEventListener('click', () => {
            if(state.isMemorizing || !deductIQ(state.costs.hint)) return;
            let diffIndices = [];
            for(let i=0; i<state.target.length; i++) { if(!state.locked[i] && state.current[i] !== state.target[i]) diffIndices.push(i); }
            if(diffIndices.length > 0) {
                let fixIndex = diffIndices[Math.floor(Math.random() * diffIndices.length)];
                state.current[fixIndex] = state.target[fixIndex]; state.locked[fixIndex] = true;
                updateBoardVisuals(); checkWin();
            }
        });

        document.getElementById('btn-skip').addEventListener('click', () => {
            if(state.isMemorizing || !deductIQ(state.costs.skip)) return;
            state.current = [...state.target];
            updateBoardVisuals(); checkWin();
        });

        function deductIQ(amount) {
            if(state.score >= amount) { state.score -= amount; updateScoreUI(); return true; } 
            else { playSound('error'); return false; }
        }

        // --- Win Logic & Cascade Animation ---
        function checkWin() {
            if(state.current.every((val, index) => val === state.target[index])) {
                state.isMemorizing = true;
                clearInterval(state.timerId);
                playSound('win');
                
                const baseScore = 100 + (state.level * 20);
                const timeBonus = state.timeLeft * 5;
                state.score += (baseScore + timeBonus);
                localStorage.setItem('kuro_score', state.score);
                updateScoreUI();

                const cells = document.querySelectorAll('.cell');
                cells.forEach((cell, i) => {
                    setTimeout(() => { cell.classList.add('win-bloom'); }, i * 20);
                });

                setTimeout(() => {
                    showModal(
                        `Level ${state.level} Cleared`, 
                        `Base IQ: +${baseScore}<br>Time Bonus: +${timeBonus}<br><b>Total Logic IQ: ${state.score}</b>`, 
                        "Initialize Next Phase ➔", 
                        () => { state.level++; localStorage.setItem('kuro_level', state.level); startLevel(); },
                        true
                    );
                }, (cells.length * 20) + 600); 
            }
        }

        function updateScoreUI() { DOM.scoreDisplay.innerText = state.score; }

        DOM.tools.forEach(tool => {
            tool.addEventListener('pointerdown', () => {
                triggerHaptic('light'); 
                DOM.tools.forEach(t => t.classList.remove('selected'));
                tool.classList.add('selected'); state.activeTool = tool.dataset.type;
            });
        });

        // --- Premium Modal & Share API ---
        function showModal(title, desc, btnText, action, showShare = false) {
            DOM.modalTitle.innerHTML = title;
            DOM.modalDesc.innerHTML = desc;
            DOM.modalBtn.innerText = btnText;
            DOM.modalShareBtn.style.display = showShare ? 'flex' : 'none'; 
            DOM.modal.classList.add('show');
            DOM.modalBtn.onclick = () => { DOM.modal.classList.remove('show'); action(); };
        }

        // Viral Share Card Generator
        DOM.modalShareBtn.addEventListener('click', async () => {
            triggerHaptic('medium');
            const canvas = document.getElementById('share-canvas');
            const ctx = canvas.getContext('2d');
            
            const grad = ctx.createRadialGradient(540, 540, 100, 540, 540, 800);
            grad.addColorStop(0, '#1a1a2e'); grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1080, 1080);
            
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 120px -apple-system, sans-serif';
            ctx.fillText('KURO LOGIC', 540, 260);
            
            ctx.fillStyle = themes[state.themeIndex].color;
            ctx.font = 'bold 60px -apple-system, sans-serif';
            ctx.fillText(`${themes[state.themeIndex].name} OS Level ${state.level}`, 540, 360);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 220px -apple-system, sans-serif';
            ctx.fillText(state.score, 540, 680);
            
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '40px -apple-system, sans-serif';
            ctx.fillText('CERTIFIED LOGIC IQ', 540, 780);

            ctx.fillStyle = themes[state.themeIndex].color;
            ctx.font = 'bold 36px -apple-system, sans-serif';
            ctx.fillText('Play at: harshavarthanep.github.io/Kuro-Logic', 540, 1000);
            
            canvas.toBlob(async (blob) => {
                const file = new File([blob], 'kuro-logic-iq.png', { type: 'image/png' });
                
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'My Kuro Logic IQ',
                            text: `I just reached Level ${state.level} with a Logic IQ of ${state.score} in Kuro Logic! Play here: https://harshavarthanep.github.io/Kuro-Logic`,
                            files: [file]
                        });
                    } catch (err) { console.log("Share cancelled", err); }
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Kuro-Logic-IQ.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
            });
        });

        document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });
        initGame();
    </script>
</body>
</html>
