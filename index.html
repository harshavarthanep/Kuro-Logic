<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kuro Logic - Glass OS</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --text-main: #ffffff;
            --text-muted: rgba(235, 235, 245, 0.6);
            --system-blue: #0A84FF;
            --system-red: #FF453A;
            --system-green: #30D158;
            --system-orange: #FF9F0A;
            
            --theme-color: var(--system-blue);
            --bg-gradient: radial-gradient(circle at 15% 50%, #1a1a2e, #0f0c29);
            --blob-speed: 12s; /* Increased base speed */
            --blob-opacity: 0.5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg-gradient); color: var(--text-main);
            min-height: 100dvh; height: 100dvh; overflow: hidden; display: flex; align-items: center; justify-content: center;
            transition: background 1s ease;
        }

        /* Fluid Background Blobs */
        .bg-blob {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: var(--blob-opacity); z-index: -1;
            animation: float var(--blob-speed) infinite alternate ease-in-out;
            transition: opacity 0.5s ease, filter 0.5s ease;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--theme-color); }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #4a00e0; animation-delay: -5s; }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(8vw, 6vh) scale(1.1); } }

        #app {
            width: 100%; max-width: 1000px; height: 100dvh; max-height: 100dvh; padding: 15px;
            display: grid; gap: 12px;
            grid-template-rows: auto minmax(0, 1fr) auto;
            grid-template-columns: 1fr;
        }
        
        @media (min-width: 768px) {
            #app { grid-template-rows: auto 1fr; grid-template-columns: 1fr 340px; align-content: center; gap: 20px; padding: 25px;}
            header { grid-column: 1 / -1; }
            #sidebar { display: flex; flex-direction: column; gap: 20px; justify-content: center; }
            #board-container { height: 100%; }
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 22px;
            box-shadow: var(--glass-shadow); padding: 16px;
        }

        header { display: flex; justify-content: space-between; align-items: center; position: relative; padding: 14px 20px; }
        .branding h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .tier-name { font-size: 12px; color: var(--theme-color); font-weight: 500; }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .score-box { text-align: right; }
        .score-val { font-size: 22px; font-weight: 700; }
        .score-label { font-size: 10px; color: var(--theme-color); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        
        .util-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border);
            color: white; width: 36px; height: 36px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .util-btn:active { transform: scale(0.9); }

        .timer-container {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 4px;
            background: rgba(255,255,255,0.08); overflow: hidden;
        }
        #timer-bar { height: 100%; background: var(--theme-color); width: 100%; transition: width 1s linear, background 0.3s; }

        #board-container { display: flex; align-items: center; justify-content: center; width: 100%; padding: 5px; }
        #game-board {
            display: grid; gap: 6px; padding: 10px; border-radius: 24px;
            background: rgba(0, 0, 0, 0.25); border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4); transition: all 0.4s ease;
        }
        
        .cell {
            width: 13vw; height: 13vw; max-width: 58px; max-height: 58px;
            background: rgba(255,255,255,0.04); border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03); cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .cell.active { background: var(--theme-color); box-shadow: 0 0 18px var(--theme-color); transform: scale(0.93); border-color: transparent; }
        .cell.locked { background: var(--system-green); box-shadow: 0 0 14px var(--system-green); pointer-events: none; opacity: 0.85; }
        
        .cell.error { border-color: var(--system-red); animation: shake 0.4s; }
        .cell.error::after { content: '✕'; position: absolute; color: var(--system-red); font-size: 24px; font-weight: bold; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

        .control-group { margin-bottom: 14px; }
        .control-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding-left: 2px; }
        
        .tool-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .tool {
            height: 54px; border-radius: 14px; background: rgba(255,255,255,0.04);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: var(--text-muted); border: 1px solid transparent; cursor: pointer; transition: 0.2s;
        }
        .tool span { font-size: 20px; font-weight: 300; margin-bottom: 1px; }
        .tool label { font-size: 9px; }
        .tool.selected { background: rgba(255,255,255,0.12); color: var(--theme-color); border-color: var(--theme-color); }

        .action-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .btn {
            padding: 12px 8px; border-radius: 14px; background: rgba(255,255,255,0.04);
            color: var(--text-main); border: 1px solid var(--glass-border); font-size: 12px; font-weight: 500;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; cursor: pointer;
        }
        .btn:active { transform: scale(0.96); }
        .btn-cost { font-size: 9px; color: var(--theme-color); font-weight: 700; background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 6px; }
        .btn-check { background: rgba(255,255,255,0.08); }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100; padding: 20px;
        }
        .modal.show { opacity: 1; pointer-events: all; }
        .modal-content {
            background: rgba(25, 25, 35, 0.85); border: 1px solid var(--glass-border);
            padding: 24px; border-radius: 28px; text-align: center; max-width: 380px; width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .modal h2 { font-size: 24px; margin-bottom: 8px; font-weight: 700;}
        .modal p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .btn-primary {
            width: 100%; padding: 14px; background: var(--text-main); color: #000;
            border-radius: 16px; font-size: 15px; font-weight: 600; border: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div id="app">
        <header class="glass-panel">
            <div class="branding">
                <h1>KURO</h1>
                <div id="tier-display" class="tier-name">OS Level 1</div>
            </div>
            <div class="header-right">
                <div class="score-box">
                    <div id="score-display" class="score-val">0</div>
                    <div class="score-label">Logic IQ</div>
                </div>
                <button class="util-btn" id="btn-install" style="display: none;" title="Install App">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
                <button class="util-btn" id="btn-audio" title="Mute/Unmute">
                    <svg id="icon-vol-on" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    <svg id="icon-vol-off" style="display:none;" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="1" x2="1" y2="23"></line></svg>
                </button>
            </div>
            <div class="timer-container"><div id="timer-bar"></div></div>
        </header>

        <div id="board-container">
            <div id="game-board"></div>
        </div>

        <div id="sidebar" class="glass-panel">
            <div class="control-group">
                <div class="control-title">Logic Tools</div>
                <div class="tool-row" id="tools">
                    <div class="tool selected" data-type="dot"><span>■</span><label>Point</label></div>
                    <div class="tool" data-type="plus"><span>+</span><label>Cross</label></div>
                    <div class="tool" data-type="cross"><span>×</span><label>Diag</label></div>
                </div>
            </div>

            <div class="control-group" style="margin-bottom: 0;">
                <div class="control-title">Super Powers (Store)</div>
                <div class="action-row">
                    <button class="btn btn-check" id="btn-check">
                        <div>✓ Verify Moves</div>
                        <div class="btn-cost" style="color:var(--text-main)">FREE</div>
                    </button>
                    <button class="btn" id="btn-hint">
                        <div>💡 Auto-Solve 1</div>
                        <div class="btn-cost" id="cost-hint">50 IQ</div>
                    </button>
                    <button class="btn" id="btn-peek">
                        <div>👁 Flash Pattern</div>
                        <div class="btn-cost" id="cost-peek">30 IQ</div>
                    </button>
                    <button class="btn" id="btn-skip">
                        <div>⏭ Skip Level</div>
                        <div class="btn-cost" id="cost-skip">200 IQ</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="msg-modal" class="modal">
        <div class="modal-content">
            <h2 id="msg-title">Title</h2>
            <p id="msg-desc">Description</p>
            <button class="btn-primary" id="btn-modal-action">Continue</button>
        </div>
    </div>

    <script>
        // --- State Management ---
        let state = {
            level: parseInt(localStorage.getItem('kuro_level')) || 1,
            score: parseInt(localStorage.getItem('kuro_score')) || 0,
            gridSize: 3,
            target: [],
            current: [],
            locked: [],
            activeTool: 'dot',
            isMemorizing: false,
            timeTotal: 60,
            timeLeft: 60,
            timerId: null,
            costs: { peek: 0, hint: 0, skip: 0 },
            audioMuted: false,
            themeIndex: 0
        };

        const themes = [
            // Glass: Calming A Minor 9 vibe
            { name: "Glass", color: "#0A84FF", bg: "radial-gradient(circle at 15% 50%, #001233, #000000)", freqs: [220, 277.18, 329.63, 440] },
            // Neon: Energetic G Major vibe
            { name: "Neon", color: "#30D158", bg: "radial-gradient(circle at 85% 20%, #00220e, #000000)", freqs: [196, 246.94, 293.66, 392] },
            // Magma: Tense E Minor vibe
            { name: "Magma", color: "#FF453A", bg: "radial-gradient(circle at 50% 80%, #220000, #000000)", freqs: [164.81, 196, 220, 329.63] },
            // Pro: Deep, mysterious C Minor vibe
            { name: "Pro", color: "#BF5AF2", bg: "radial-gradient(circle at 50% 50%, #140024, #000000)", freqs: [130.81, 155.56, 196, 261.63] }
        ];

        const DOM = {
            board: document.getElementById('game-board'),
            tierDisplay: document.getElementById('tier-display'),
            scoreDisplay: document.getElementById('score-display'),
            timerBar: document.getElementById('timer-bar'),
            tools: document.querySelectorAll('.tool'),
            modal: document.getElementById('msg-modal'),
            modalTitle: document.getElementById('msg-title'),
            modalDesc: document.getElementById('msg-desc'),
            modalBtn: document.getElementById('btn-modal-action'),
            audioBtn: document.getElementById('btn-audio'),
            installBtn: document.getElementById('btn-install')
        };

        // --- Premium Web Audio Engine ---
        let audioCtx = null;
        let bgmOsc = null;
        let bgmGain = null;
        let bgmFilter = null;
        let bgmTimeout = null;
        let bgmStep = 0; // Tracks which note of the theme's chord to play

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startBmitter();
        }

        function startBmitter() {
            if (!audioCtx || state.audioMuted) return;
            try {
                bgmOsc = audioCtx.createOscillator();
                bgmGain = audioCtx.createGain();
                bgmFilter = audioCtx.createBiquadFilter();
                
                // Use a soft sine wave instead of harsh triangle
                bgmOsc.type = 'sine'; 
                
                // Muffle the sound to make it sound "ambient" and deep
                bgmFilter.type = 'lowpass';
                bgmFilter.frequency.value = 600; 

                // Start silent to prevent popping
                bgmGain.gain.setValueAtTime(0, audioCtx.currentTime); 
                
                bgmOsc.connect(bgmFilter);
                bgmFilter.connect(bgmGain);
                bgmGain.connect(audioCtx.destination);
                
                bgmOsc.start();
                tickBGM();
            } catch(e) { console.log(e); }
        }

        function tickBGM() {
            if (!audioCtx || state.audioMuted || !bgmOsc) return;
            let now = audioCtx.currentTime;
            let pct = state.timeLeft / state.timeTotal;
            
            // Get the current theme's chord
            let currentChord = themes[state.themeIndex].freqs;
            let freq = currentChord[bgmStep % currentChord.length];
            bgmStep++; // Move to the next note for the next tick
            
            let interval = 1200; // Slower, more relaxing default pace
            if (pct <= 0.25) { interval = 350; bgmFilter.frequency.value = 1200; } // Panic: Faster, brighter sound
            else if (pct <= 0.5) { interval = 600; bgmFilter.frequency.value = 800; } // Tension: Medium pace
            else { bgmFilter.frequency.value = 400; } // Relaxed: Muffled and deep
            
            // Smoothly glide to the new note
            bgmOsc.frequency.setTargetAtTime(freq, now, 0.1);
            
            // Premium ambient "pulse" envelope
            bgmGain.gain.cancelScheduledValues(now);
            bgmGain.gain.setValueAtTime(0.01, now);
            bgmGain.gain.linearRampToValueAtTime(0.3, now + 0.1); // Swell up
            bgmGain.gain.exponentialRampToValueAtTime(0.01, now + (interval/1000) * 0.8); // Fade out smoothly
            
            bgmTimeout = setTimeout(tickBGM, interval);
        }

        function playSound(type) {
            if (!audioCtx || state.audioMuted) return;
            let now = audioCtx.currentTime;

            // Helper to generate a quick, shaped sound
            const createSynth = (waveType, startFreq, volume) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = waveType;
                osc.frequency.setValueAtTime(startFreq, now);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                return { osc, gain };
            };

            if (type === 'tap') {
                // Glassy, modern "tick" (High frequency sine wave, extremely short fade)
                let synth = createSynth('sine', 1200, 0);
                synth.gain.gain.setValueAtTime(0.8, now);
                synth.gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                synth.osc.start(now); synth.osc.stop(now + 0.05);
                
            } else if (type === 'error') {
                // Soft, muffled "thud"
                let synth = createSynth('sine', 200, 0);
                synth.gain.gain.setValueAtTime(1.0, now);
                synth.gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                synth.osc.frequency.exponentialRampToValueAtTime(50, now + 0.2); // Pitch drops slightly
                synth.osc.start(now); synth.osc.stop(now + 0.2);
                
            } else if (type === 'win') {
                // Premium ascending "chime" (Plays a quick major chord)
                const chimeNotes = [523.25, 659.25, 783.99, 1046.50]; // C Major arpeggio
                chimeNotes.forEach((freq, i) => {
                    let synth = createSynth('sine', freq, 0);
                    let startTime = now + (i * 0.06); // Stagger the notes
                    synth.gain.gain.setValueAtTime(0, now);
                    synth.gain.gain.setValueAtTime(0.5, startTime);
                    synth.gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.5);
                    synth.osc.start(startTime); synth.osc.stop(startTime + 0.5);
                });
            }
        }

        
        // Add sound to all buttons
        document.querySelectorAll('.btn, .tool, .util-btn, .btn-primary').forEach(el => {
            el.addEventListener('pointerdown', () => { initAudio(); playSound('tap'); });
        });
        document.body.addEventListener('pointerdown', initAudio, { once: true });
        
        function updateAudioTrack() {
            // Instantly sync the BGM to the new theme's starting note when a level changes
            if (bgmOsc && audioCtx && !state.audioMuted) {
                bgmStep = 0; 
            }
        }


        DOM.audioBtn.addEventListener('click', () => {
            initAudio();
            state.audioMuted = !state.audioMuted;
            document.getElementById('icon-vol-on').style.display = state.audioMuted ? 'none' : 'block';
            document.getElementById('icon-vol-off').style.display = state.audioMuted ? 'block' : 'none';
            if (state.audioMuted) {
                clearTimeout(bgmTimeout);
                if (bgmOsc) { try { bgmOsc.stop(); } catch(e){} bgmOsc = null; }
            } else {
                startBmitter();
            }
        });

        // --- Native PWA Install Handler ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            DOM.installBtn.style.display = 'flex';
        });

        DOM.installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                deferredPrompt = null;
                DOM.installBtn.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            DOM.installBtn.style.display = 'none';
        });

        // --- Core Application Initialization ---
        function initGame() {
            updateScoreUI();
            startLevel();
        }

        function calculateEconomy() {
            state.costs.peek = Math.floor(20 + (state.level * 10));
            state.costs.hint = Math.floor(40 + (state.level * 15));
            state.costs.skip = Math.floor(150 + (state.level * 50));
            
            document.getElementById('cost-peek').innerText = state.costs.peek + ' IQ';
            document.getElementById('cost-hint').innerText = state.costs.hint + ' IQ';
            document.getElementById('cost-skip').innerText = state.costs.skip + ' IQ';
        }

        function startLevel() {
            calculateEconomy();
            state.gridSize = Math.min(3 + Math.floor((state.level - 1) / 4), 6);
            state.themeIndex = Math.min(Math.floor((state.level - 1) / 4), themes.length - 1);
            
            document.documentElement.style.setProperty('--theme-color', themes[state.themeIndex].color);
            document.documentElement.style.setProperty('--bg-gradient', themes[state.themeIndex].bg);
            document.documentElement.style.setProperty('--blob-speed', '12s'); // Reset speed
            document.documentElement.style.setProperty('--blob-opacity', '0.5');
            
            DOM.tierDisplay.innerText = `${themes[state.themeIndex].name} OS • Lv ${state.level}`;
            DOM.board.style.gridTemplateColumns = `repeat(${state.gridSize}, 1fr)`;
            
            state.timeTotal = Math.max(20, 45 + (state.gridSize * 10) - (state.level * 2));
            state.timeLeft = state.timeTotal;
            DOM.timerBar.style.background = 'var(--theme-color)';
            DOM.timerBar.style.width = '100%';
            
            updateAudioTrack();
            generateTarget();
            renderBoard();
            flashPattern();
        }

        function generateTarget() {
            const totalCells = state.gridSize * state.gridSize;
            state.target = Array(totalCells).fill(false);
            state.current = Array(totalCells).fill(false);
            state.locked = Array(totalCells).fill(false);
            
            const flips = state.level * 2; 
            for(let i=0; i<flips; i++) {
                let rIndex = Math.floor(Math.random() * totalCells);
                state.target[rIndex] = !state.target[rIndex];
            }
            if(!state.target.includes(true)) state.target[0] = true; 
        }

        function renderBoard() {
            DOM.board.innerHTML = '';
            for(let i = 0; i < state.gridSize * state.gridSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('pointerdown', (e) => { e.preventDefault(); handleCellTap(i, cell); });
                DOM.board.appendChild(cell);
            }
            updateBoardVisuals();
        }

        function flashPattern() {
            state.isMemorizing = true;
            clearInterval(state.timerId);
            
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                if(state.target[i]) cell.classList.add('active');
                else cell.classList.remove('active');
            });
            
            setTimeout(() => {
                state.isMemorizing = false;
                updateBoardVisuals();
                startTimer();
            }, Math.max(1000, 3000 - (state.level * 100)));
        }

        function startTimer() {
            clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timeLeft--;
                const pct = (state.timeLeft / state.timeTotal) * 100;
                DOM.timerBar.style.width = `${pct}%`;
                
                if(pct <= 25) {
                    DOM.timerBar.style.background = 'var(--system-red)';
                    document.documentElement.style.setProperty('--blob-speed', '3s'); // Panic motion
                    document.documentElement.style.setProperty('--blob-opacity', '0.8');
                }
                
                if(state.timeLeft <= 0) {
                    clearInterval(state.timerId);
                    playSound('error');
                    showModal("Time Expired", "Your focus faded. The system collapsed.", "Retry Level", startLevel);
                }
            }, 1000);
        }

        function handleCellTap(index, cellEl) {
            if(state.isMemorizing) return;
            initAudio(); playSound('tap');
            document.querySelectorAll('.cell.error').forEach(c => c.classList.remove('error'));

            const row = Math.floor(index / state.gridSize);
            const col = index % state.gridSize;

            const toggle = (r, c) => {
                if(r >= 0 && r < state.gridSize && c >= 0 && c < state.gridSize) {
                    let idx = r * state.gridSize + c;
                    if(!state.locked[idx]) {
                        state.current[idx] = !state.current[idx];
                    }
                }
            }

            if (state.activeTool === 'dot') { toggle(row, col); }
            if (state.activeTool === 'plus') { toggle(row, col); toggle(row-1, col); toggle(row+1, col); toggle(row, col-1); toggle(row, col+1); }
            if (state.activeTool === 'cross') { toggle(row, col); toggle(row-1, col-1); toggle(row-1, col+1); toggle(row+1, col-1); toggle(row+1, col+1); }

            updateBoardVisuals();
            checkWin();
        }

        function updateBoardVisuals() {
            if(state.isMemorizing) return;
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.className = 'cell';
                if(state.current[i]) cell.classList.add('active');
                if(state.locked[i]) cell.classList.add('locked');
            });
        }
        
        // --- Power Shop ---
        document.getElementById('btn-check').addEventListener('click', () => {
            if(state.isMemorizing) return;
            const cells = document.querySelectorAll('.cell');
            let foundError = false;
            for(let i=0; i<state.current.length; i++) {
                if(state.current[i] === true && state.target[i] === false) {
                    cells[i].classList.add('error');
                    foundError = true;
                }
            }
            if(foundError) {
                playSound('error');
            } else {
                // Success Flash Fix
                playSound('win');
                DOM.board.style.borderColor = 'var(--system-green)';
                DOM.board.style.boxShadow = 'inset 0 0 30px rgba(48, 209, 88, 0.4)';
                setTimeout(() => {
                    DOM.board.style.borderColor = 'var(--glass-border)';
                    DOM.board.style.boxShadow = 'inset 0 0 20px rgba(0,0,0,0.4)';
                }, 600);
            }
        });

        document.getElementById('btn-peek').addEventListener('click', () => {
            if(state.isMemorizing || !deductIQ(state.costs.peek)) return;
            const tempCurrent = [...state.current];
            flashPattern();
            setTimeout(() => { state.current = tempCurrent; updateBoardVisuals(); }, 2000);
        });

        document.getElementById('btn-hint').addEventListener('click', () => {
            if(state.isMemorizing || !deductIQ(state.costs.hint)) return;
            let diffIndices = [];
            for(let i=0; i<state.target.length; i++) {
                if(!state.locked[i] && state.current[i] !== state.target[i]) {
                    diffIndices.push(i);
                }
            }
            if(diffIndices.length > 0) {
                let fixIndex = diffIndices[Math.floor(Math.random() * diffIndices.length)];
                state.current[fixIndex] = state.target[fixIndex];
                state.locked[fixIndex] = true;
                updateBoardVisuals();
                checkWin();
            }
        });

        document.getElementById('btn-skip').addEventListener('click', () => {
            if(state.isMemorizing || !deductIQ(state.costs.skip)) return;
            state.current = [...state.target];
            updateBoardVisuals();
            checkWin();
        });

        function deductIQ(amount) {
            if(state.score >= amount) {
                state.score -= amount;
                updateScoreUI();
                return true;
            } else {
                playSound('error');
                return false;
            }
        }

        function checkWin() {
            if(state.current.every((val, index) => val === state.target[index])) {
                state.isMemorizing = true;
                clearInterval(state.timerId);
                playSound('win');
                
                const baseScore = 100 + (state.level * 20);
                const timeBonus = state.timeLeft * 5;
                const earned = baseScore + timeBonus;
                
                state.score += earned;
                localStorage.setItem('kuro_score', state.score);
                updateScoreUI();

                setTimeout(() => {
                    showModal(
                        `Level ${state.level} Complete`, 
                        `Base IQ: +${baseScore}<br>Time Bonus: +${timeBonus}<br>Total Logic IQ: ${state.score}`, 
                        "Next Level ➔", 
                        () => {
                            state.level++;
                            localStorage.setItem('kuro_level', state.level);
                            startLevel();
                        }
                    );
                }, 600);
            }
        }

        function updateScoreUI() {
            DOM.scoreDisplay.innerText = state.score;
        }

        DOM.tools.forEach(tool => {
            tool.addEventListener('click', () => {
                DOM.tools.forEach(t => t.classList.remove('selected'));
                tool.classList.add('selected');
                state.activeTool = tool.dataset.type;
            });
        });

        function showModal(title, desc, btnText, action) {
            DOM.modalTitle.innerHTML = title;
            DOM.modalDesc.innerHTML = desc;
            DOM.modalBtn.innerText = btnText;
            DOM.modal.classList.add('show');
            DOM.modalBtn.onclick = () => {
                DOM.modal.classList.remove('show');
                action();
            };
        }

        document.addEventListener('dblclick', function(event) { event.preventDefault(); }, { passive: false });
        initGame();
    </script>
</body>
</html>
